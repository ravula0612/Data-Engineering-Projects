resources:
  pipelines:
    cargo:
      name: cargo-medallion-${var.catalog}-${var.schema}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      libraries:
        - notebook:
            path: ../src/pipeline.py
      configuration:
        cargo.landing_path: /Volumes/${var.catalog}/${var.schema}/${var.volume}/events
        spark.sql.session.timeZone: UTC

  jobs:
    cargo_demo:
      name: cargo-medallion-demo-${var.catalog}-${var.schema}
      max_concurrent_runs: 1
      tasks:
        - task_key: seed
          notebook_task:
            notebook_path: ../src/seed.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              fixture_dir: ${workspace.file_path}/fixtures
        - task_key: refresh
          depends_on:
            - task_key: seed
          pipeline_task:
            pipeline_id: ${resources.pipelines.cargo.id}
            full_refresh: false
        - task_key: verify
          depends_on:
            - task_key: refresh
          notebook_task:
            notebook_path: ../src/verify.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
